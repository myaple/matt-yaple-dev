name = "matt-yaple-dev"
compatibility_date = "2026-11-16"

# Personal site served on matt.yaple.dev — no public workers.dev copy.
workers_dev = false
preview_urls = false

# Static site: everything in ./site is uploaded as Workers static assets.
# Assets-only (no main module) so unmatched paths serve 404.html with a real 404.
[assets]
directory = "./site"
html_handling = "drop-trailing-slash"
not_found_handling = "404-page"
